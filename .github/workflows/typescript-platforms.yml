name: TypeScript platform compatibility

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/web/package.json'
      - 'apps/worker/package.json'
      - 'apps/**/tsconfig*.json'
      - '.github/workflows/typescript-platforms.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/web/package.json'
      - 'apps/worker/package.json'
      - 'apps/**/tsconfig*.json'
      - '.github/workflows/typescript-platforms.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Type check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show TypeScript version
        run: npx tsc --version

      - name: Type check workspaces
        run: npm run typecheck
